# Copy to agent-file-sync.local.yaml and select this host's mode.
# The local file is gitignored; another host never changes this configuration.
#
# Both modes install user-scope skills from skills/.installation-policy.json:
#   Codex: ~/.agents/skills/<name>
#   Claude: ~/.claude/skills/<name>
#
# host-global: instruction links at ~/.codex/AGENTS.md and ~/.claude/CLAUDE.md.
#              moreh-dev-scope skills are intentionally not installed.
# moreh-dev:   instruction links at <moreh_dev_root>/AGENTS.md and CLAUDE.md;
#              moreh-dev-scope skills at that checkout's .agents/skills/<name>
#              and .claude/skills/<name>. No host-global instructions are added.
#
# moreh_dev_root must name an existing Git checkout root in moreh-dev mode.
# Resolve relative paths from dotfiles; use absolute paths as written.
# Never search for, create, or clone an alternate target.
# An absent/invalid mode blocks installation. An invalid moreh_dev_root blocks
# project installation only; user-scope skills still install, but the refresh
# cannot receive a successful-sync stamp.
mode: host-global
# moreh_dev_root: ../moreh-metal
